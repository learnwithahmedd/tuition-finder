<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tuition Finder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo-row">
      <span class="logo-icon">🎓</span>
      <h1>Tuition Finder</h1>
    </div>
    <p>Find the right tutor for you</p>
  </header>

  <main>
    <section id="search-bar">
      <input type="text" id="subject-input" placeholder="Subject (e.g. Math)">
      <input type="text" id="location-input" placeholder="Location">
      <input type="number" id="price-input" placeholder="Max price">
      <select id="mode-input">
        <option value="">Any mode</option>
        <option value="Online">Online</option>
        <option value="In-person">In-person</option>
      </select>
      <button id="search-btn">Search</button>
      <button id="reset-btn">Reset</button>
    </section>

    <section id="tutor-list">
      <!-- Tutor cards go here, filled in by script.js -->
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Tuition Finder</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
