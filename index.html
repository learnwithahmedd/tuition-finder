<!DOCTYPE html>
<html lang="en">
<nav class="navbar">
  <div class="nav-logo">🎓 Tuition Finder</div>
  <div class="nav-right">
    <button id="theme-toggle" class="theme-toggle">🌙</button>
    <div class="nav-links" id="nav-links">
      <!-- Filled in dynamically by nav.js based on login status -->
    </div>
  </div>
</nav>
<head>
  <meta charset="UTF-8">
  <title>Tuition Finder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>

 <header class="hero">
  <div class="hero-bg-shape shape1"></div>
  <div class="hero-bg-shape shape2"></div>

  <div class="logo-row">
    <span class="logo-icon">🎓</span>
    <h1>Tuition Finder</h1>
  </div>
  <p class="hero-subtitle">Connect with trusted tutors near you — in minutes.</p>

  <div class="hero-cta">
    <a href="#search-bar" class="hero-btn primary">Find a Tutor</a>
    <a href="signup.html" class="hero-btn secondary">Become a Tutor</a>
  </div>

  <p id="hero-count" class="hero-count"></p>
</header>

  <main>
    <section id="search-bar">
      <input type="text" id="subject-input" placeholder="Subject (e.g. Math)">
      <input type="text" id="name-input" placeholder="Tutor name">
      <input type="text" id="location-input" placeholder="Location">
      <input type="number" id="price-input" placeholder="Max price">
      <select id="mode-input">
        <option value="">Any mode</option>
        <option value="Online">Online</option>
        <option value="In-person">In-person</option>
      </select>
      <select id="sort-input">
        <option value="">Sort by</option>
        <option value="price-low">Price: Low to High</option>
        <option value="rating-high">Rating: High to Low</option>
      </select>
      <button id="search-btn">Search</button>
      <button id="reset-btn">Reset</button>
    </section>

    <p id="results-count"></p>

    <section id="tutor-list">
      <!-- Tutor cards go here, filled in by script.js -->
    </section>

    <p style="text-align:center; margin-top: 10px;">
      <a href="login.html">Are you a tutor or student? Log in / Sign up</a>
    </p>
  </main>

  <footer>
    <p>&copy; 2026 Tuition Finder</p>
  </footer>

   <script type="module" src="script.js"></script>
  <script type="module" src="nav.js"></script>
</body>
</html>
