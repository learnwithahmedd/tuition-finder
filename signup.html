<!DOCTYPE html>
<html lang="en">
  <nav class="navbar">
  <div class="nav-logo">🎓 Tuition Finder</div>
  <button id="hamburger-btn" class="hamburger-btn">☰</button>
  <div class="nav-right" id="nav-right">
    <button id="theme-toggle" class="theme-toggle">🌙</button>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Tuition Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo-row">
      <span class="logo-icon">🎓</span>
      <h1>Tuition Finder</h1>
    </div>
    <p>Create your account</p>
  </header>

  <main>
    <section id="auth-form">
      <input type="text" id="name-input" placeholder="Full name">
      <input type="email" id="email-input" placeholder="Email">
      <input type="password" id="password-input" placeholder="Password">

      <div id="role-choice">
  <label class="role-card">
    <input type="radio" name="role" value="teacher">
    <span class="role-icon">👨‍🏫</span>
    <span>Teacher</span>
  </label>
  <label class="role-card">
    <input type="radio" name="role" value="student">
    <span class="role-icon">🎒</span>
    <span>Student</span>
  </label>
</div>

      <button id="signup-btn">Sign Up</button>
      <p id="auth-message"></p>
      <p>Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <footer class="site-footer">
  <div class="footer-links">
    <a href="index.html">Search</a>
    <a href="signup.html">Become a Tutor</a>
    <a href="login.html">Log in</a>
  </div>
  <p>&copy; 2026 Tuition Finder — built with ❤️ in Pakistan</p>
</footer>

    <script type="module" src="signup.js"></script>
  <script type="module" src="nav.js"></script>
</body>
</html>
