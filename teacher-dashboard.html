<!DOCTYPE html>
<html lang="en">
   <nav class="navbar">
  <div class="nav-logo">🎓 Tuition Finder</div>
  <div class="nav-right">
    <button id="theme-toggle" class="theme-toggle">🌙</button>
    <div class="nav-links" id="nav-links">
      <!-- Filled in dynamically by nav.js based on login status -->
    </div>
  </div>
</nav>
<head>
  <meta charset="UTF-8">
  <title>Teacher Dashboard - Tuition Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo-row">
      <span class="logo-icon">🎓</span>
      <h1>Teacher Dashboard</h1>
    </div>
    <p id="welcome-text">Welcome!</p>
  </header>

   <main>
    <div class="dashboard-layout">
    <section id="auth-form">
      <h3>Add Your Tuition Listing</h3>
      <input type="text" id="subject-input" placeholder="Subject (e.g. Math)">
      <input type="text" id="location-input" placeholder="Location">
      <input type="number" id="price-input" placeholder="Fee (Rs.)">
      <input type="text" id="phone-input" placeholder="WhatsApp number (e.g. 923001234567)">
      <select id="mode-input">
        <option value="Online">Online</option>
        <option value="In-person">In-person</option>
      </select>
      <button id="save-btn">Save Listing</button>
      <button id="cancel-edit-btn" style="display:none; background:#999;">Cancel Edit</button>
      <p id="status-message"></p>
    </section>

    <section id="tutor-list">
      <h3 style="text-align:center; margin-bottom: 10px;">Your Listings</h3>
        </section>
    </div>

    <p style="text-align:center; margin-top: 20px;">
      <a href="#" id="logout-link">Log out</a>
    </p>
  </main>

  <footer>
    <p>&copy; 2026 Tuition Finder</p>
  </footer>

    <script type="module" src="teacher-dashboard.js"></script>
  <script type="module" src="nav.js"></script>
</body>
</html>
